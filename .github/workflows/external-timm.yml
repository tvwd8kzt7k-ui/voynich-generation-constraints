name: External Timm generator audit

on:
  workflow_dispatch:
  push:
    paths:
      - "external_validation/timm/**"
      - "canonical/core.py"
      - "canonical/tests/low_dimensional_family.py"
      - "frozen/human_operation/**"
      - ".github/workflows/external-timm.yml"
  pull_request:
    paths:
      - "external_validation/timm/**"
      - "canonical/core.py"
      - "canonical/tests/low_dimensional_family.py"
      - "frozen/human_operation/**"
      - ".github/workflows/external-timm.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test adapter and failure paths
        run: python -m unittest discover -s external_validation/timm -p 'test_*.py' -v
      - name: Run pinned external-generator audit
        run: |
          python external_validation/timm/run.py --fetch \
            --check external_validation/timm/expected_results.json
      - name: Save audit report including numerical failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-timm-audit
          path: external_validation/timm/results.json
          if-no-files-found: warn
